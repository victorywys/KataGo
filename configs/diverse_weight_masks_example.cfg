# KataGo Configuration with Enhanced Diverse Weight Masks
# This configuration demonstrates the new diverse weight mask capabilities

# Basic engine settings
logDir = analysis_logs
maxVisits = 500
nnCacheSizePowerOfTwo = 23
nnMaxBatchSize = 64
nnMutexPoolSizePowerOfTwo = 17
nnRandomize = true
numAnalysisThreads = 2
numSearchThreads = 16
reportAnalysisWinratesAs = BLACK

# ENHANCED WEIGHT MASK SETTINGS
# =============================

# weightMaskUniformProb: Probability of using uniform (all 1.0) weight masks
# Default: 0.30 (30% chance)
# Range: 0.0 to 1.0
# Purpose: Some training uses standard uniform weighting for baseline learning
weightMaskUniformProb = 0.20

# weightMaskDiverseProb: Probability of using diverse structured weight masks
# Default: 0.50 (50% chance) 
# Range: 0.0 to 1.0
# Purpose: Train with local areas, group-based, and regional weight patterns
# This helps the model handle inference-time masks on stone groups and local areas
weightMaskDiverseProb = 0.70

# The remaining 10% (1.0 - 0.20 - 0.70) will use simple random weight masks
# Distribution breakdown:
# - 20% uniform masks (all weights = 1.0)
# - 70% diverse structured masks:
#   - 17.5% local circular/square area masks (1-3 areas per board)
#   - 17.5% stone group-based masks (affects groups and nearby empty points)  
#   - 17.5% corner/side/center regional emphasis masks
#   - 17.5% geometric patterns (diagonal strips, checkerboard, etc.)
# - 10% simple random masks (original random [0.5, 1.5] per point)

# Diverse mask types include:
# 1. LOCAL AREA MASKS: Circular/square regions with different weights
#    - 1-3 random areas per board
#    - Weights: [0.2-0.5] for low emphasis, [1.5-2.0] for high emphasis
#    - Simulates focusing on specific board regions during analysis
#
# 2. GROUP-BASED MASKS: Weight existing stone groups and surroundings
#    - Finds connected stone groups, applies random weights
#    - Also affects 1-2 point radius around groups
#    - Weights: [0.1-0.5] for low, [1.5-2.3] for high emphasis
#    - Simulates analysis focusing on specific stone groups
#
# 3. REGIONAL MASKS: Structured board region emphasis
#    - Corner emphasis (3-6 point squares in corners)
#    - Side emphasis (2-5 point strips along edges)  
#    - Center emphasis (circular areas around board center)
#    - Diagonal strips (main/anti-diagonal with 1-3 point width)
#    - Horizontal/vertical strips (1-3 strips, 1-2 points wide)
#    - Checkerboard patterns (2x2, 3x3, or 4x4 squares)
#
# 4. GEOMETRIC PATTERNS: Regular mathematical weight distributions
#    - Various structured patterns for training robustness

# Training game settings
maxMovesPerGame = 600
numGamesPerGatingMatch = 200

# Self-play and training settings  
resignation.allowed = true
resignation.threshold = -0.90
resignation.consecutiveTurnsToAllow = 8

# For reference: these settings work together to create training data
# that helps the model handle diverse weight mask scenarios during inference,
# particularly when you want to focus analysis on specific groups or board areas.
